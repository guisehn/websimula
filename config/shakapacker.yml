# Recompile with bin/shakapacker after changing this file.
# Missing keys fall back to the defaults shipped with the shakapacker gem.

default: &default
  source_path: app/javascript
  source_entry_path: packs
  public_root_path: public
  public_output_path: packs
  cache_path: tmp/shakapacker
  webpack_compile_output: true
  additional_paths: []
  cache_manifest: false
  javascript_transpiler: babel
  # Vue 2's loader expects a default export from style blocks. Shakapacker's
  # bundled default is the named CSS Modules export introduced in v9.
  css_modules_export_mode: default
  assets_bundler: webpack
  shakapacker_precompile: true
  ensure_consistent_versioning: true
  compiler_strategy: digest

development:
  <<: *default
  compile: true
  compiler_strategy: mtime
  dev_server:
    host: localhost
    port: 3035
    hmr: false
    inline_css: true
    client:
      overlay: true
    compress: true
    allowed_hosts: "auto"
    pretty: true
    headers:
      "Access-Control-Allow-Origin": "*"

test:
  <<: *default
  compile: true
  public_output_path: packs-test

production:
  <<: *default
  compile: false
  cache_manifest: true
